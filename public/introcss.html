<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/introcss.css">
    <title>INTRODUCTION TO CSS</title>
</head>
<body>
    <!-- CSS (CASCADING STYLE SHEETS) it's a stylesheet language used to describethe presentation of a of a document written in HTML. -->

    <!-- CSS has 2 basic syntax
     1 - Selectors
     2 - Properties and Values-->

     <!-- 3 types of CSS 
      1 - INLINE CSS - we style our element directly inside the element -->
      
      <p style="color: brown;">it's monday and it's raining </p>

      <!-- 2 INTERNAL CSS - we style within the style tag in the HTML document -->

      <style>
       .wiz{
            background-color: brown;
       }
       #mike{
            color: pink;
       }
      </style>

      <!-- ID and CLASSES-->
       <!-- CLASS is identified as . and ID is identified as # -->

       <p class="james">my name is bryan dike</p>
       <p id="mike">this is a frontend class</p>
       <p class="wiz">it's monday today</p>

       <!-- EXTERNAL CSS - we style our document in an external .css file linked to the HTML document-->

       <h1 class="one">MY BLOG WEBSITE</h1>
       <h4 class="two">this is the heading</h4>
       <p id="one">this is the story of my life</p>
       <p id="two">this is the end of my website</p>
</body>
</html>
