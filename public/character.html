<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARCTER ENTITIES</title>
</head>
<body>
    <!-- Character entities are we having special keywords that turns normal letters into symbols.

    Reserved characters in HTML have special or specific meanings. 
    -->

    <p>less than - &lt;</p>
    <p>greater than - &gt;</p>
    <p>Naira - &#8358;</p>
    <p>Copyright - &copy;</p>
    <p>Register - &reg;</p>
    <p>Trademark - &trade;</p>
    <p>Next page - &rarr;</p>
    <p>Back - &larr;</p>
    <p>&euro;</p>
    <p>&pound;</p>
    <p>&yen;</p>
    <p>&cent;</p>
    <p>&hearts;</p>
    <p>&diams;</p>
    <p>&#9824;</p>
    <p>&#10003;</p>
    <p>&#1007;</p>
    <!-- HTML character entities are used to displayreserved characters or characters that are not present on the keyboard. -->
     <!-- character entities start with an ampersand(&) and end with a semicolon(;). -->
      <!-- there are three types of character entities 
       1. Named
       character entities 2. Numeric
       character entities 3. Hexadecimal
       character entities 4 -->
</body>
</html>
