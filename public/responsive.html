<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/assets/fontawesome-free-7.3.1-web/css/all.css">
    <title>MEDIA QUERY</title>
</head>
<body>
    <!-- Whenevr we are making a website, we thibk mobile first because 80-90% of our users will view or access the website through
     their mobile devices -->

     <!-- Whwn we talk about responsiveness, we talk about making our website look good and remain functional on all screen sizes 
      (phone, tablets, laptop and desktop)-->

      <!-- CSS media queries help us change our styles bsed on different screen sizes.-->

      <!-- A media query allows you to apply CSS only when certain conditions are true -->

      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>

      <!-- NAVBAR-->
       <header>
        <h1>My website</h1>
        <div class="hamburger"> <i class="fa-solid fa-bars"></i></div>
        <nav class="menu">
             <a href="#">Home</a>
             <a href="#">About</a>
             <a href="#">Contact</a>
        </nav>
       </header>

       <!--HERO IMAGE-->
       <section>
        <img src="/assets/img/john doe.jpg" alt="">
       </section>
       <div class="container">
        <!--Content-->
        <main class="content">
            <h2>Welcome</h2>
            <p>This is a Responsive Design Demo using Media Queries</p>

            <!--GRID-->
            <div class="grid">
                <div class="box">Box 1</div>
                <div class="box">Box 2</div>
                <div class="box">Box 3</div>
            </div>
        </main>
        <!--SIDEBAR-->
        <aside class="sidebar">
            <h3>Sidebar</h3>
            <p>Extra Content Appears On Larger Screens</p>
        </aside>
       </div>

       <!--BUTTON-->
       <div class="btn-container">
        <button>Click Me</button>
       </div>
</body>
</html>
