<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" name="Name" id="name" placeholder="Inpute Your Name"> <br> <br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Input Your Password"> <br> <br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Input Your Email"> <br> <br>

        <label for="tel">Phone Number:</label>
        <input type="tel" id="tel" placeholder="Input Your Phone Number"> <br> <br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date"> <br> <br>

        <label for="range">Range</label>
        <input type="range" id="range" name="range"> <br> <br>

        <label for="color">Favourite Color</label>
        <input type="color" id="color" name="color"> <br> <br>

        <!-- Drop Down Menu-->
         <label for="state">Pick Your State</label>
         <select name="state" id="state">
            <option value="imo">Imo</option>
             <option value="enugu">Enugu</option>
              <option value="rivers">Rivers</option>
               <option value="jos">Jos</option>
                <option value="taraba">Taraba</option>
         </select> <br> <br>

         <!-- RADIO BUTTON -->
         <label for="status">Marital Status</label>
         <input type="radio" name="status" value="married">Married
         <input type="radio" name="status" value="single">Single
         <input type="radio" name="status" value="seperated">Seperated <br> <br>

         <!-- CHECKBOX -->
          <p>What course are you taking</p>
          <input type="checkbox" id="python" name="course" value="python">
          <label for="python">Python</label> <br><br>
          <input type="checkbox" id="php" name="course" value="php">
          <label for="php">PHP</label> <br><br>
          <input type="checkbox" id="react" name="course" value="react">
          <label for="react">React</label> <br><br>

          <input type="submit" value="submit">

    </form>
</body>
</html>
