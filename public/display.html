<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/display.css">
    <title>DISPLAY PROPERTIES</title>
</head>
<body>
    <!--The css display proprties display controls how an element appears on 
    the page and how it interacts wigth other element -->

    <!-- Diffrent Display Properties-->

    <!-- Display : Block-->
     <div class="box">Header</div>
     <div class="box">Main</div>
     <div class="box">Footer</div>

     <!-- Display : Inline-->
      <p>Visit Our <span class="highlight">Store</span> Today</p>

      <!-- Display: None-->


      <!-- Display: Inline Block-->
       <div class="card">Product 1</div>
       <div class="card">Product 2</div>

       <!-- Grid Display-->
        <div class="grid">
            <div class="boxg">Card1</div>
            <div class="boxg">Card2</div>
            <div class="boxg">Card3</div>
            <div class="boxg">Card4</div>
            <div class="boxg">Card5</div>
            <div class="boxg">Card6</div>
        </div>




    
</body>
</html>
